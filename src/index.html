<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webview App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Webview-driven mobile app</h1>
      <p>This app is ready to be wrapped in Capacitor for iOS and Android deployment.</p>
      <section class="card">
        <h2>How it works</h2>
        <ul>
          <li>Build the static assets into the <code>www</code> folder.</li>
          <li>Sync them into platform projects with <code>npx cap sync</code>.</li>
          <li>Open the native shells in Android Studio or Xcode to run and package.</li>
        </ul>
      </section>
    </main>
    <script src="main.js" type="module"></script>
  </body>
</html>
